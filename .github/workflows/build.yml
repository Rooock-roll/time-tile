name: Build TIME tile

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-tile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install --quiet pillow

      # jsDelivr caches @branch for up to 12h, and cdn.jsdelivr.net is blocked on
      # the target network, so pictures are published under a pinned SHA on the
      # fastly edge. build-tile.py reads the base URL from TILE_CDN_BASE.
      - name: Build tile content
        env:
          TILE_CDN_BASE: https://fastly.jsdelivr.net/gh/${{ github.repository }}@${{ github.sha }}
        run: python build-tile.py

      - name: Commit generated files
        run: |
          git config user.name  "time-tile-bot"
          git config user.email "time-tile-bot@users.noreply.github.com"
          git add -A tile.xml img articles.json
          if git diff --cached --quiet; then
            echo "no change"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            git commit -m "tile update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "NEWSHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      # The images only exist in the commit we just pushed, so regenerate once
      # more pointing at that SHA and amend the reference in tile.xml only.
      - name: Repoint tile.xml at the pushed commit
        if: env.NEWSHA != ''
        env:
          TILE_CDN_BASE: https://fastly.jsdelivr.net/gh/Rooock-roll/time-tile@${{ env.NEWSHA }}
        run: |
          python build-tile.py
          git add tile.xml
          git commit -m "point tile at $(echo $NEWSHA | cut -c1-7)" || echo "nothing to commit"
          git push
